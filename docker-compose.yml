services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: uei
      POSTGRES_PASSWORD: uei_local
      POSTGRES_DB: uei
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/docker/001-postgis.sql:/docker-entrypoint-initdb.d/001-postgis.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uei']
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  postgres:
